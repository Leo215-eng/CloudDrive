services:
  mysql:
    image: mysql:8.0
    container_name: networkdisk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: network_disk
      TZ: Asia/Shanghai
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - networkdisk-mysql-data:/var/lib/mysql
      - ./DDL/sql/DDL_network_disk.sql:/docker-entrypoint-initdb.d/01-network-disk.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: networkdisk-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass 123456
    ports:
      - "6379:6379"
    volumes:
      - networkdisk-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: networkdisk-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8848/nacos/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  networkdisk-mysql-data:
  networkdisk-redis-data:

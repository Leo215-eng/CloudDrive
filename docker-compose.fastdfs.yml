name: networkdisk-fastdfs

# 本编排独立于 docker-compose.local.yml：不包含 MySQL、Redis、Nacos 等现有本地基础设施。
# 每个 Storage 都运行镜像内置的 FastDFS Nginx；独立 access-nginx 通过 Docker 内网代理它们。
# 对浏览器仅发布 8888；Tracker、Storage 与其内置 Nginx 的地址只在 Docker 网络内使用。
services:
  fastdfs-tracker:
    image: ygqygq2/fastdfs-nginx:latest
    container_name: networkdisk-fastdfs-tracker
    command: tracker
    restart: unless-stopped
    ports:
      # 文件服务的 FastDFS 客户端经宿主机访问 Tracker；不要在前端或公开配置中使用此端口。
      - "22122:22122"
    volumes:
      - fastdfs-tracker-data:/var/fdfs
    networks:
      - fastdfs-net
    healthcheck:
      # 仅检查进程存活；副本完整性由独立验收阶段的 fdfs_monitor 与校验和验证。
      test: ["CMD-SHELL", "test -n \"$(pidof fdfs_trackerd)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  fastdfs-storage-1:
    image: ygqygq2/fastdfs-nginx:latest
    container_name: networkdisk-fastdfs-storage-1
    command: storage
    restart: unless-stopped
    depends_on:
      fastdfs-tracker:
        condition: service_healthy
    environment:
      TRACKER_SERVER: fastdfs-tracker:22122
      GROUP_NAME: group1
    volumes:
      - fastdfs-storage-1-data:/var/fdfs
    networks:
      - fastdfs-net
    healthcheck:
      # 镜像内的 storage 命令会同时启动 fdfs_storaged 与 FastDFS Nginx。
      test: ["CMD-SHELL", "test -n \"$(pidof fdfs_storaged)\" && test -n \"$(pidof nginx)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  fastdfs-storage-2:
    image: ygqygq2/fastdfs-nginx:latest
    container_name: networkdisk-fastdfs-storage-2
    command: storage
    restart: unless-stopped
    depends_on:
      fastdfs-tracker:
        condition: service_healthy
    environment:
      TRACKER_SERVER: fastdfs-tracker:22122
      GROUP_NAME: group1
    volumes:
      - fastdfs-storage-2-data:/var/fdfs
    networks:
      - fastdfs-net
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$(pidof fdfs_storaged)\" && test -n \"$(pidof nginx)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  fastdfs-access-nginx:
    image: nginx:1.27-alpine
    container_name: networkdisk-fastdfs-access-nginx
    restart: unless-stopped
    depends_on:
      fastdfs-storage-1:
        condition: service_healthy
      fastdfs-storage-2:
        condition: service_healthy
    ports:
      # 唯一对浏览器暴露的入口；反向代理保留 group1/M00/... 逻辑路径。
      - "8888:8080"
    volumes:
      - ./fastdfs/nginx/access.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - fastdfs-net
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  fastdfs-net:
    name: networkdisk-fastdfs-net
    driver: bridge

volumes:
  # 命名卷在 `docker compose down` 后保留；仅 `down -v` 才会删除，故障演练禁止使用 -v。
  fastdfs-tracker-data:
    name: networkdisk-fastdfs-tracker-data
  fastdfs-storage-1-data:
    name: networkdisk-fastdfs-storage-1-data
  fastdfs-storage-2-data:
    name: networkdisk-fastdfs-storage-2-data

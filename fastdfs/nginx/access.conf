upstream fastdfs_storage_upstream {
    # 这是被动健康探测：连接错误、超时或指定 5xx 会触发 proxy_next_upstream。
    # Docker 服务名而非容器 IP 使重建 Storage 后地址可重新解析。
    server fastdfs-storage-1:8080 max_fails=2 fail_timeout=10s;
    server fastdfs-storage-2:8080 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    # 不暴露任何节点信息；仅转发 FastDFS 的逻辑路径。
    location /group1/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_pass http://fastdfs_storage_upstream;
    }

    location / {
        return 404;
    }
}

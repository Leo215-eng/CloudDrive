# 本地开发专用：注册给 NameServer 的地址必须是宿主机 Java 客户端可达的地址。
# listenPort 与宿主机 NETWORKDISK_RMQ_LISTEN_PORT 默认相同，避免 NameServer 返回容器内部端口。
brokerClusterName=DefaultCluster
brokerName=networkdisk-local-broker
brokerId=0
brokerIP1=127.0.0.1
listenPort=__BROKER_LISTEN_PORT__
namesrvAddr=rocketmq-namesrv:9876
autoCreateTopicEnable=true

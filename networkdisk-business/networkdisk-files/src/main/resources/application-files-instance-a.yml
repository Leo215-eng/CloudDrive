# File-service instance A. Runtime command-line arguments repeat these values
# so Nacos configuration cannot accidentally make two local JVMs identical.
server:
  port: 8082

spring:
  cloud:
    nacos:
      discovery:
        instance-id: networkdisk-files-a-8082
        metadata:
          local-instance: a

dubbo:
  protocol:
    port: 20882
  application:
    qos-port: 22222

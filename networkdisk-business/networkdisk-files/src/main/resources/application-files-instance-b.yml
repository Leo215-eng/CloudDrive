# File-service instance B. It shares the service name with A, but has a
# distinct HTTP endpoint, Nacos instance id and Dubbo QoS port.
server:
  port: 8083

spring:
  cloud:
    nacos:
      discovery:
        instance-id: networkdisk-files-b-8083
        metadata:
          local-instance: b

dubbo:
  protocol:
    port: 20883
  application:
    qos-port: 22223

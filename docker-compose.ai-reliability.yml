services:
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.0
    container_name: networkdisk-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    ports:
      - "${NETWORKDISK_RMQ_NAMESRV_PORT:-19876}:9876"
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n localhost:9876 >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 20

  rocketmq-broker:
    image: apache/rocketmq:5.3.0
    container_name: networkdisk-rocketmq-broker
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      NETWORKDISK_RMQ_LISTEN_PORT: ${NETWORKDISK_RMQ_LISTEN_PORT:-20911}
    command: >-
      sh -c 'sed "s/__BROKER_LISTEN_PORT__/$${NETWORKDISK_RMQ_LISTEN_PORT}/g" /home/rocketmq/rocketmq-5.3.0/conf/broker.conf.template > /tmp/broker.conf && sh mqbroker -n rocketmq-namesrv:9876 -c /tmp/broker.conf'
    ports:
      - "${NETWORKDISK_RMQ_VIP_PORT:-20909}:20909"
      - "${NETWORKDISK_RMQ_LISTEN_PORT:-20911}:20911"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.0/conf/broker.conf.template:ro

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: networkdisk-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: networkdisk_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      TZ: Asia/Shanghai
    ports:
      - "${NETWORKDISK_PGVECTOR_PORT:-15432}:5432"
    volumes:
      - networkdisk-pgvector-data:/var/lib/postgresql/data
      - ./DDL/sql/DDL_network_disk_ai_pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d networkdisk_ai"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  networkdisk-pgvector-data:
